<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>분수의 곱셈과 소수의 곱셈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 다른 수업 앱(쌓기나무·원주와 원의 넓이)과 같은 색·글꼴 */
:root{--bg:#EDF1F3;--surface:#FFFFFF;--surface2:#EDF1F3;--ink:#1D2B36;--muted:#5C6B77;--line:#C9D3DA;--accent:#2F6FDB;--accent-ink:#fff;--c1:#D9482B;--sel:#DCEAFF;--sel-ink:#1B4FB0;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B21;--surface:#1D262E;--surface2:#232E37;--ink:#E8EEF2;--muted:#9AA8B3;--line:#34424D;--accent:#6FA3F5;--accent-ink:#10182a;--c1:#F0775C;--sel:#1F3A63;--sel-ink:#CFE1FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141B21;--surface:#1D262E;--surface2:#232E37;--ink:#E8EEF2;--muted:#9AA8B3;--line:#34424D;--accent:#6FA3F5;--accent-ink:#10182a;--c1:#F0775C;--sel:#1F3A63;--sel-ink:#CFE1FF;color-scheme:dark}
*{box-sizing:border-box}

.app{max-width:1100px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}

h1{margin:0;font-size:clamp(26px,4vw,36px)}

h1,button,label,output,select{font-family:var(--display);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}

button{font:inherit;font-family:var(--display);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.btn,.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 13px;font-size:16px}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
canvas{display:block;width:100%;border-radius:12px;background:var(--surface2);touch-action:none;cursor:grab}
.hint{font-size:14px;color:var(--muted);margin:6px 0}

.row label{font-size:15px;min-width:64px}

.row output{font-size:17px;min-width:56px;text-align:right}

.say b.r{color:var(--c1)}
select{font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--surface);color:var(--ink)}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:15.5px}
th{background:var(--surface2);font-family:var(--display);font-weight:400}
td.st{text-align:left;font-weight:700}
.ck{min-width:46px;min-height:36px;padding:4px 8px;font-size:19px;line-height:1}
td.res{width:44px;font-size:18px}
.vt td{height:92px;font-family:var(--display);font-size:17px;width:33.3%}
.vt td.no{color:var(--muted);font-size:26px}
.vt svg{display:block;margin:0 auto 2px;width:54px;height:46px;color:var(--accent)}
input[type=number]{font:inherit;width:74px;padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);margin-left:4px}
input.ok{border-color:#1E8E5A;background:rgba(30,142,90,.12)}input.bad{border-color:var(--c1);background:rgba(217,72,43,.12)}
.msg{font-weight:700;min-height:24px;margin:6px 0 0}.msg.ok{color:#1E8E5A}.msg.bad{color:var(--c1)}
.note{color:var(--muted);font-size:14px;margin:6px 0 0}
.found{background:var(--surface2);border:2px solid #1E8E5A;border-radius:10px;padding:10px 13px;margin:10px 0 0;font-size:16px;font-weight:700;line-height:1.8}
.found small{display:block;color:#1E8E5A;font-size:13px}.found i{font-style:normal;color:var(--c1)}
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
.dims .row label{min-width:40px}
.score{margin-left:auto;font-family:var(--display)}
input.wide{width:130px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 3px;font-family:var(--display);font-weight:400}
.fr i{font-style:normal;border-bottom:2px solid currentColor;padding:0 4px}.fr span{padding:0 4px}
.fin{display:inline-flex;flex-direction:column;vertical-align:middle;gap:3px;align-items:center}.fin input{margin:0;width:64px;text-align:center}.fin hr{width:100%;border:0;border-top:2.5px solid var(--ink);margin:0}
.dims .row label{min-width:40px;white-space:nowrap}
.say small .fr,.say .fr{font-size:.95em}
.dims .row{flex-wrap:nowrap}.dims .row input[type=range]{flex:1 1 0;min-width:0;width:auto}.dims .row output{min-width:30px;text-align:right}
canvas{cursor:default}
</style></head><body>
<div class="app">
  <header><h1>분수의 곱셈과 소수의 곱셈</h1><p>넓이 그림으로 분수와 소수의 곱셈을 알아봐요</p></header>
  <div class="card"><div class="tabs" id="tabs" role="tablist">
    <button data-t="fk" role="tab" aria-selected="true">① 분수 × 자연수</button>
    <button data-t="ff" role="tab" aria-selected="false">② 분수 × 분수</button>
    <button data-t="dd" role="tab" aria-selected="false">③ 소수 × 소수</button>
    <button data-t="pt" role="tab" aria-selected="false">④ 소수점 위치</button>
    <button data-t="quiz" role="tab" aria-selected="false">⑤ 문제 풀기</button>
  </div></div>
  <section class="card"><div class="stage">
    <div id="top"></div>
    <canvas id="cv"></canvas>
    <p class="hint" id="hint"></p>
    <div id="ctl"></div>
    <div class="say" id="say"></div>
  </div></section>
</div>
<script>

var D3=false, TAB0="fk";

/* 단위 막대: parts 등분, fills=[[개수,색]...] 를 왼쪽부터 칠함 */

function sld(id,lab,min,max,val){ return '<div class="row"><label>'+lab+'</label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" value="'+val+'"><output>'+val+'</output></div>'; }
function sldBind(id,fn){ $(id).oninput=function(){ this.nextElementSibling.textContent=this.value; fn(+this.value); ui(); draw(); var e=$(id); if(e) e.focus(); }; }
function frIn(p,whole){ return (whole?'<input type="number" id="'+p+'w" inputmode="numeric" style="width:58px;margin:0 4px 0 0" aria-label="자연수">':'')+'<span class="fin"><input type="number" id="'+p+'n" inputmode="numeric" aria-label="분자"><hr><input type="number" id="'+p+'d" inputmode="numeric" aria-label="분모"></span>'; }
/* 입력한 분수 값 {n,d} (가분수로). 비어 있으면 null */
function frVal(p){ var w=$(p+'w')?$(p+'w').value:'', n=$(p+'n').value, d=$(p+'d').value; if(n===''&&d===''&&w==='') return null; if(n===''&&d==='') return {n:+w,d:1}; if(d===''){ d='1'; } if(+d===0) return null; return {n:(+w||0)*(+d)+(+n||0),d:+d}; }
function frShow(p,n,d){ var k=gcd(n,d)||1; n/=k; d/=k; var w=Math.floor(n/d), r=n-w*d; if($(p+'w')){ $(p+'w').value=w||''; if(r){ $(p+'n').value=r; $(p+'d').value=d; } } else { $(p+'n').value=n; $(p+'d').value=d; } [p+'w',p+'n',p+'d'].forEach(function(i){ if($(i)){ $(i).disabled=true; if($(i).value!=='') $(i).className='ok'; } }); }
/* 숫자 뒤 조사: P(수,'이','가') → 받침 있으면 앞의 것 */
function P(n,a,b){ var s=(''+n).replace(/[^0-9]/g,''), d=s[s.length-1]; return '013678'.indexOf(d)>=0?a:b; }

function anim(get,set,to,dur,done){ anStop(); var from=get(), t0=performance.now(); (function step(now){ var k=Math.min(1,(now-t0)/(dur||1500)), e=k*k*(3-2*k); set(from+(to-from)*e); if(k<1){ anT=requestAnimationFrame(step); draw(); } else { anT=null; if(done) done(); draw(); } })(t0); }
function pick(a){ return a[rnd(a.length)]; }
function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function BWd(){ return Math.min(W-48,620); }
var PC=[BLUE,ORANGE,GREEN,PINK,YEL,GRAY,[170,150,235],[120,205,215]];
function scoreH(s){ return '<span class="score">맞힌 문제 '+s[0]+' / '+s[1]+'</span>'; }
function chipsH(arr,cur,attr,st){ return '<div class="chips"'+(st?' style="'+st+'"':'')+'>'+arr.map(function(k){ return '<button class="chip" aria-pressed="'+(k[0]===cur)+'" data-'+attr+'="'+k[0]+'">'+k[1]+'</button>'; }).join('')+'</div>'; }
function ri(a,b){ return a+rnd(b-a+1); }
function beads(x,y,n,col,r,perRow){ perRow=perRow||10; for(var i=0;i<n;i++){ g.beginPath(); g.arc(x+(i%perRow)*(r*2+5)+r,y+Math.floor(i/perRow)*(r*2+5)+r,r,0,7); g.fillStyle=col; g.fill(); g.strokeStyle=INK; g.lineWidth=1.5; g.stroke(); } }
/* 공통 문제 엔진. gen() → {lines:[글 또는 토큰배열], ask:html, kind:'mc'|'num'|'pair', opts, ans, unit, why} */
function QZ(gen){ var o={q:null,score:[0,0]};
  o.next=function(){ o.q=gen(); o.q.done=false; o.q.tries=0; o.q.right=false; };
  o.draw=function(){ if(!o.q) o.next(); var q=o.q, n=q.lines.length, sz=Math.min(40,W/14,(H-40)/(n*1.9)), y=H/2-(n-1)*sz*0.95;

    else h='<span style="font-size:17px">답 = '+(q.kind==='pair'?'<input type="number" id="qA" inputmode="decimal" step="any"> : <input type="number" id="qB" inputmode="decimal" step="any">':'<input type="number" class="wide" id="qA" inputmode="decimal" step="any">')+' '+(q.unit||'')+'</span>'+(q.done?'':'<button class="btn primary" id="qGo">확인하기</button>');
    $('ctl').innerHTML='<div class="row" style="margin-top:8px">'+h+'<button class="btn'+(q.done?' primary':'')+'" id="qNext">'+(q.done?'다음 문제 ▶':'건너뛰기')+'</button>'+scoreH(o.score)+'</div><p class="msg '+(cls||'')+'" id="qMsg">'+(msg||'')+'</p>';

function DD(x){ return (Math.round(x*1000)/1000)+''; }
/* 캔버스 표: rows=[[이름, 값들...]], hl=칸 색(선택). 아래쪽 y를 돌려줌 */
function ctable(rows,y0,hl,rh){ var n=rows[0].length-1, lw=Math.min(150,W*0.3), cw=Math.min(74,(W-30-lw)/n), x0=(W-lw-cw*n)/2; rh=rh||40;

var GC=[BLUE,ORANGE,GREEN,PINK,YEL,[170,150,235],GRAY];
