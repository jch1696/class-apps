<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>약분과 통분, 분수의 덧셈과 뺄셈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>

canvas{cursor:default}
</style></head><body>
<div class="app">
  <header><h1>약분과 통분, 분수의 덧셈과 뺄셈</h1><p>분수 막대를 나누고 합치며 약분과 통분, 크기 비교, 덧셈과 뺄셈, 분수와 소수의 관계를 알아봐요</p></header>
  <div class="card"><div class="tabs" id="tabs" role="tablist">

    <button data-t="red" role="tab" aria-selected="false">② 약분</button>
    <button data-t="com" role="tab" aria-selected="false">③ 통분</button>
    <button data-t="cmp" role="tab" aria-selected="false">④ 크기 비교</button>
    <button data-t="add" role="tab" aria-selected="false">⑤ 덧셈</button>
    <button data-t="sub" role="tab" aria-selected="false">⑥ 뺄셈</button>
    <button data-t="dec" role="tab" aria-selected="false">⑦ 분수와 소수</button>
    <button data-t="quiz" role="tab" aria-selected="false">⑧ 문제 풀기</button>
  </div></div>
  <section class="card"><div class="stage">
    <div id="top"></div>
    <canvas id="cv"></canvas>

  </div></section>
</div>

function frVal(p){ var w=$(p+'w')?$(p+'w').value:'', n=$(p+'n').value, d=$(p+'d').value; if(n===''&&d===''&&w==='') return null; if(n===''&&d==='') return {n:+w,d:1}; if(d===''){ d='1'; } if(+d===0) return null; return {n:(+w||0)*(+d)+(+n||0),d:+d}; }

var PC=[BLUE,ORANGE,GREEN,PINK,YEL,GRAY,[170,150,235],[120,205,215]];

function chipsH(arr,cur,attr,st){ return '<div class="chips"'+(st?' style="'+st+'"':'')+'>'+arr.map(function(k){ return '<button class="chip" aria-pressed="'+(k[0]===cur)+'" data-'+attr+'="'+k[0]+'">'+k[1]+'</button>'; }).join('')+'</div>'; }

var qz=null, qzScore=[0,0];

    q.show=F(a.n,a.d)+' '+q.ans+' '+F(b.n,b.d); q.why='통분하면 '+F(a.n,a.d)+' = '+F(A5,L)+', '+F(b.n,b.d)+' = '+F(C5,L)+'이에요. 분자를 비교하면 '+A5+' '+q.ans+' '+C5+'.'; }
  else if(t===6){ var d6=pick([2,4,5,8,20,25,50]), n6; do{ n6=ri(1,d6-1); }while(gcd(n6,d6)>1); var T6=T10(d6), k6=T6/d6; q.kind='dec'; q.tk=[{n:n6,d:d6}]; q.ans=n6/d6; q.show=dcs(n6,d6); q.ask='분수를 소수로 나타내 보세요.'; q.hint='분모를 '+T6+Pr(T6)+' 만들어요. 분모와 분자에 '+J(k6,'을','를')+' 곱해요.';
    q.why='분모와 분자에 '+J(k6,'을','를')+' 곱하면 '+F(n6*k6,T6)+' = '+q.show; }

  else { do{ a=prop(8); b=prop(8); }while(a.d===b.d); w1=t>=3?ri(1,3):0; w2=t>=3?ri(0,2):0; L=lcm(a.d,b.d); var A=(w1*a.d+a.n)*L/a.d, C=(w2*b.d+b.n)*L/b.d, add=(t===1||t===3);
    if(!add&&A<C){ var x=a; a=b; b=x; x=w1; w1=w2; w2=x; x=A; A=C; C=x; } if(!add&&A===C){ w1++; A+=L; }
    q.tk=[{w:w1,n:a.n,d:a.d},add?'+':'−',{w:w2,n:b.n,d:b.d}]; q.n=add?A+C:A-C; q.d=L; q.ask='계산해 보세요.'; q.why='통분하면 '+MXH(w1,a.n*L/a.d,L)+(add?' + ':' − ')+MXH(w2,b.n*L/b.d,L)+' = '+MX(q.n,q.d); }

function qzDraw(){ if(!qz) qzNew(); var q=qz, SM='<small style="font-size:15.5px;color:var(--ink)">';
