<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>원주와 원의 넓이</title>
<style>
:root{--bg:#f3f1ea;--surface:#fff;--surface2:#f8f6f0;--ink:#1f2430;--muted:#687083;--line:#d9d5c8;--accent:#3d5a98;--accent-ink:#fff;--c1:#e2513a;--c2:#f2b84b;--c3:#3aa6b5;--c4:#5aa33c;--ok:#2e7d4f;--bad:#c2372d;--shadow:0 1px 2px rgba(30,30,40,.07),0 8px 22px -12px rgba(30,30,40,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--surface:#1d2027;--surface2:#242832;--ink:#e9ebf1;--muted:#9aa2b4;--line:#3a4050;--accent:#8fb0ee;--accent-ink:#10182a;--c1:#ff8a73;--c2:#f2b84b;--c3:#5cc3d4;--c4:#8fd070;--ok:#6fcf97;--bad:#ff8a7a;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#14161b;--surface:#1d2027;--surface2:#242832;--ink:#e9ebf1;--muted:#9aa2b4;--line:#3a4050;--accent:#8fb0ee;--accent-ink:#10182a;--c1:#ff8a73;--c2:#f2b84b;--c3:#5cc3d4;--c4:#8fd070;--ok:#6fcf97;--bad:#ff8a7a;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.app{max-width:1100px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{margin:0;font-size:clamp(20px,3vw,26px)}
header p{margin:0;color:var(--muted);font-size:13.5px}
h2{margin:0 0 6px;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:12.5px;font-weight:700;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn,.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 13px;font-size:14px;font-weight:600}
.chip{border-radius:999px;background:var(--surface2)}
.btn.primary,.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:700;font-size:14.5px;padding:8px 14px;border-radius:9px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--ink);font-family:inherit}
input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.stats div{background:var(--surface2);border-radius:10px;padding:8px 11px}
.stats span{font-size:12px;color:var(--muted);display:block}
.stats b{font-size:19px;font-variant-numeric:tabular-nums}
.stats .hot{outline:2.5px solid var(--c1)}
.say{background:var(--surface2);border-left:5px solid var(--accent);border-radius:8px;padding:9px 12px;margin:8px 0 0;font-size:15px}
.say b{color:var(--c1)}
.formula{font-size:clamp(16px,2.4vw,21px);font-weight:700;text-align:center;margin:10px 0 0;line-height:1.7}
.formula i{font-style:normal;color:var(--c1)}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hidden{display:none!important}
.note{color:var(--muted);font-size:13.5px;margin:6px 0 0}
input[type=number]{font:inherit;width:110px;padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.msg{font-weight:700;min-height:24px;margin:8px 0 0}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
</style>
</head><body>
<div class="app">
  <header><h1>원주와 원의 넓이</h1><p>그림을 움직여 보며 원주율, 원주, 원의 넓이 구하는 방법을 알아봐요</p></header>
  <div class="card"><div class="tabs" role="tablist">
    <button data-tab="roll" role="tab" aria-selected="true">① 원주율 찾기</button>
    <button data-tab="cut" role="tab" aria-selected="false">② 원의 넓이 (잘라 붙이기)</button>
    <button data-tab="est" role="tab" aria-selected="false">③ 넓이 어림하기</button>
    <button data-tab="quiz" role="tab" aria-selected="false">④ 계산 연습</button>
  </div></div>

  <!-- 1 -->
  <section id="p-roll" class="card">
    <h2>원을 한 바퀴 굴리면 얼마나 갈까요?</h2>
    <svg id="rollSvg" viewBox="0 0 1000 350" role="img" aria-label="원을 굴려 원주를 재는 그림"></svg>
    <div class="row" style="margin-top:6px"><span class="lab">지름</span><input type="range" id="dS" min="2" max="10" step="1" value="5" aria-label="지름"><span class="lab">굴리기</span><input type="range" id="pS" min="0" max="1000" value="0" aria-label="굴린 정도"><button class="btn primary" id="rollPlay">한 바퀴 굴리기</button></div>
    <div class="stats" id="rollStats"></div>
    <p class="say" id="rollSay"></p>
    <p class="formula">원주율 = 원주 ÷ 지름 = <i>약 3.14</i> &nbsp;→&nbsp; 원주 = 지름 × 원주율</p>
  </section>

  <!-- 2 -->
  <section id="p-cut" class="card hidden">
    <h2>원을 잘라 붙이면 어떤 도형이 될까요?</h2>
    <svg id="cutSvg" viewBox="0 0 1000 400" role="img" aria-label="원을 부채꼴로 잘라 직사각형 모양으로 붙이는 그림"></svg>
    <div class="row" style="margin-top:6px"><span class="lab">자르는 조각 수</span>
      <button class="chip" data-n="8" aria-pressed="false">8</button><button class="chip" data-n="16" aria-pressed="true">16</button><button class="chip" data-n="32" aria-pressed="false">32</button><button class="chip" data-n="64" aria-pressed="false">64</button>
      <span class="lab" style="margin-left:6px">펼치기</span><input type="range" id="tS" min="0" max="1000" value="0" aria-label="펼친 정도"><button class="btn primary" id="cutPlay">펼쳐 붙이기</button></div>
    <p class="say" id="cutSay"></p>
    <p class="formula">원의 넓이 = <i>(원주의 ½)</i> × 반지름 = 반지름 × 반지름 × 원주율</p>
  </section>

  <!-- 3 -->
  <section id="p-est" class="hidden grid2">
    <div class="card"><svg id="estSvg" viewBox="0 0 520 520" role="img" aria-label="모눈 위의 원과 정사각형"></svg></div>
    <div class="card">
      <h2>원의 넓이는 얼마쯤일까요?</h2>
      <div class="row"><span class="lab">반지름</span><input type="range" id="rS" min="2" max="6" step="1" value="4" aria-label="반지름"><b id="rLbl"></b></div>
      <div class="row" style="margin-top:8px"><button class="chip" id="showSq" aria-pressed="true">정사각형으로 어림</button><button class="chip" id="showGrid" aria-pressed="false">모눈 세어 어림</button></div>
      <div class="stats" id="estStats"></div>
      <p class="say" id="estSay"></p>
    </div>
  </section>

  <!-- 4 -->
  <section id="p-quiz" class="hidden grid2">
    <div class="card"><svg id="quizSvg" viewBox="0 0 420 320" role="img" aria-label="문제의 원"></svg></div>
    <div class="card">
      <h2 id="qTitle"></h2>
      <div class="row"><span class="lab">원주율</span><button class="chip" data-pi="300" aria-pressed="false">3</button><button class="chip" data-pi="310" aria-pressed="false">3.1</button><button class="chip" data-pi="314" aria-pressed="true">3.14</button></div>
      <div class="row" style="margin-top:10px"><label class="lab" for="aC">원주</label><input type="number" id="aC" step="any" inputmode="decimal"> cm</div>
      <div class="row" style="margin-top:8px"><label class="lab" for="aA">넓이</label><input type="number" id="aA" step="any" inputmode="decimal"> cm²</div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="qCheck">확인</button><button class="btn" id="qShow">풀이 보기</button><button class="btn" id="qNew">새 문제</button></div>
      <p class="msg" id="qMsg"></p>
      <p class="say hidden" id="qSol"></p>
    </div>
  </section>
</div>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  function fmt(x){return String(parseFloat(x.toFixed(2)));}
  var PI=Math.PI,raf=null;
  function animate(input,ms,draw){cancelAnimationFrame(raf);var t0=null;input.value=0;(function step(now){if(t0===null)t0=now;var u=Math.min(1,(now-t0)/ms);u=u*u*(3-2*u);input.value=Math.round(u*1000);draw();if(u<1)raf=requestAnimationFrame(step);})(performance.now());}

  /* ---------- 1. 원주율 ---------- */
  function drawRoll(){
    var d=+$("dS").value,p=+$("pS").value/1000,s=23,R=d*s/2,C=PI*d*s,x0=128,gy=262,cx=x0+p*C,cy=gy-R,th=p*360,o='';
    o+='<line x1="15" x2="985" y1="'+gy+'" y2="'+gy+'" stroke="var(--muted)" stroke-width="2"/>';
    for(var k=0;k<=32;k++){var x=x0+k*s,big=k%5===0;o+='<line x1="'+x+'" x2="'+x+'" y1="'+gy+'" y2="'+(gy+(big?10:5))+'" stroke="var(--muted)" stroke-width="'+(big?1.6:1)+'"/>';if(big)o+='<text x="'+x+'" y="'+(gy+25)+'" font-size="13" text-anchor="middle" style="fill:var(--muted)">'+k+'</text>';}
    o+='<text x="975" y="'+(gy+25)+'" font-size="12" text-anchor="end" style="fill:var(--muted)">cm</text>';
    o+='<line x1="'+x0+'" x2="'+cx+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--c1)" stroke-width="7" stroke-linecap="round"/>';
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="var(--surface2)" stroke="var(--line)" stroke-width="2"/>';
    if(p<0.999)o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="var(--c1)" stroke-width="7" stroke-dasharray="'+((1-p)*C)+' '+(C+10)+'" transform="rotate('+(90+th)+' '+cx+' '+cy+')"/>';
    var a=(90+th)*PI/180,mx=cx+R*Math.cos(a),my=cy+R*Math.sin(a);
    o+='<line x1="'+mx+'" y1="'+my+'" x2="'+(2*cx-mx)+'" y2="'+(2*cy-my)+'" stroke="var(--c3)" stroke-width="4"/>';
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="var(--ink)"/><circle cx="'+mx+'" cy="'+my+'" r="7" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/>';
    o+='<text x="'+cx+'" y="'+(cy-R-10)+'" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--c3)">지름 '+d+' cm</text>';
    var by=gy+38,laid=p*C;
    for(var i=0;i<4;i++){var a0=i*d*s,a1=Math.min((i+1)*d*s,laid);if(a1<=a0)break;var full=(a1-a0)>=d*s-0.5;
      o+='<rect x="'+(x0+a0)+'" y="'+by+'" width="'+(a1-a0)+'" height="22" rx="4" fill="'+(i<3?"var(--c3)":"var(--c2)")+'" opacity="'+(i%2?0.7:1)+'" stroke="var(--surface)" stroke-width="2"/>';
      if(full&&i<3)o+='<text x="'+(x0+a0+d*s/2)+'" y="'+(by+16)+'" font-size="13" font-weight="700" text-anchor="middle" style="fill:#fff">지름 '+(i+1)+'</text>';}
    o+=p>0.999?'<text x="'+x0+'" y="'+(by+46)+'" font-size="15" font-weight="700" style="fill:var(--c1)">지름 막대 3개보다 조금 더 길어요! (지름의 약 3.14배)</text>':'<text x="'+x0+'" y="'+(by+44)+'" font-size="13" style="fill:var(--muted)">굴러간 거리를 지름 막대로 재어 보면…</text>';
    $("rollSvg").innerHTML=o;
    var dist=p*PI*d,done=p>0.999;
    $("rollStats").innerHTML='<div><span>지름</span><b>'+d+' cm</b></div><div><span>'+(done?"원주 (한 바퀴 굴러간 거리)":"굴러간 거리")+'</span><b>약 '+fmt(dist)+' cm</b></div><div class="'+(done?"hot":"")+'"><span>'+(done?"원주 ÷ 지름":"굴러간 거리 ÷ 지름")+'</span><b>약 '+fmt(dist/d)+'</b></div>';
    $("rollSay").innerHTML=done?"지름이 "+d+" cm인 원의 원주는 약 "+fmt(dist)+" cm예요. <b>지름을 바꿔 다시 굴려 보세요.</b> 원주 ÷ 지름은 언제나 약 3.14로 같아요. 이 값을 <b>원주율</b>이라고 해요.":"빨간 점이 다시 바닥에 닿을 때까지 굴리면, 빨간 선의 길이가 원의 둘레(원주)와 같아요.";
  }
  $("dS").oninput=function(){cancelAnimationFrame(raf);drawRoll();};$("pS").oninput=function(){cancelAnimationFrame(raf);drawRoll();};
  $("rollPlay").onclick=function(){animate($("pS"),4200,drawRoll);};

  /* ---------- 2. 잘라 붙이기 ---------- */
  var N=16;
  function drawCut(){
    var t=+$("tS").value/1000,R=120,cx=170,cy=200,a=2*PI/N,h=R*Math.sin(a/2),hc=R*Math.cos(a/2),X0=400,W=N*h,yb=cy+hc/2,yt=yb-hc,o='';
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 5"/>';
    var sec='M0 0 L'+hc+' '+(-h)+' A'+R+' '+R+' 0 0 1 '+hc+' '+h+' Z';
    for(var i=0;i<N;i++){var up=i<N/2,k=up?i:i-N/2,ai=-90+(i+0.5)*360/N,tg=up?-90:90,dd=((tg-ai+540)%360)-180;
      var tx=up?X0+h+2*h*k:X0+2*h*k+2*h,ty=up?yb:yt;if(!up&&k===N/2-1){/* last down piece sits at right end */}
      if(!up)tx=X0+2*h*(k+1);
      var x=cx+(tx-cx)*t,y=cy+(ty-cy)*t,r=ai+dd*t;
      o+='<path d="'+sec+'" transform="translate('+x+' '+y+') rotate('+r+')" fill="'+(up?"var(--c2)":"var(--c3)")+'" stroke="var(--surface)" stroke-width="'+(N>32?0.6:1.2)+'"/>';}
    o+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'" stroke="'+(t<0.05?"var(--ink)":"var(--muted)")+'" stroke-width="2.5"/><text x="'+(cx+R/2)+'" y="'+(cy-8)+'" font-size="15" font-weight="700" text-anchor="middle" style="fill:'+(t<0.05?"var(--ink)":"var(--muted)")+'">반지름</text>';
    if(t>0.97){var x1=X0+h/2,x2=X0+h/2+W;
      o+='<rect x="'+x1+'" y="'+yt+'" width="'+W+'" height="'+hc+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 5"/>';
      o+='<line x1="'+x1+'" x2="'+x2+'" y1="'+(yb+22)+'" y2="'+(yb+22)+'" stroke="var(--c1)" stroke-width="3"/><text x="'+(x1+W/2)+'" y="'+(yb+46)+'" font-size="16" font-weight="700" text-anchor="middle" style="fill:var(--c1)">가로 = 원주의 ½</text>';
      o+='<line x1="'+(x2+18)+'" x2="'+(x2+18)+'" y1="'+yt+'" y2="'+yb+'" stroke="var(--ink)" stroke-width="3"/><text x="'+(x2+28)+'" y="'+(yt+hc/2+5)+'" font-size="16" font-weight="700">세로 = 반지름</text>';}
    $("cutSvg").innerHTML=o;
    $("cutSay").innerHTML=t>0.97?(N<32?"아직 위아래가 울퉁불퉁해요. <b>조각 수를 늘려</b> 다시 펼쳐 보세요.":"거의 <b>직사각형</b>이 됐어요! 가로는 노란 조각들의 둥근 부분을 이은 길이라서 원주의 절반이고, 세로는 반지름이에요."):"원을 부채꼴 "+N+"조각으로 잘랐어요. 노란 조각은 위로, 파란 조각은 아래로 엇갈려 붙여 봐요.";
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-n]"),function(b){b.onclick=function(){N=+b.dataset.n;Array.prototype.forEach.call(document.querySelectorAll("[data-n]"),function(o){o.setAttribute("aria-pressed",o===b);});cancelAnimationFrame(raf);drawCut();};});
  $("tS").oninput=function(){cancelAnimationFrame(raf);drawCut();};
  $("cutPlay").onclick=function(){animate($("tS"),3600,drawCut);};

  /* ---------- 3. 어림 ---------- */
  var E={sq:true,grid:false};
  function drawEst(){
    var r=+$("rS").value,s=36,c=7,off=8,o='',inside=0,edge=0,X=function(v){return off+v*s;};
    $("rLbl").textContent=r+" cm";
    if(E.grid){for(var i=0;i<14;i++)for(var j=0;j<14;j++){var far=0,cor=[[i,j],[i+1,j],[i,j+1],[i+1,j+1]];cor.forEach(function(q){far=Math.max(far,Math.hypot(q[0]-c,q[1]-c));});
      var nx=Math.max(i,Math.min(c,i+1)),ny=Math.max(j,Math.min(c,j+1)),near=Math.hypot(nx-c,ny-c);
      if(far<=r+1e-9){inside++;o+='<rect x="'+X(i)+'" y="'+X(j)+'" width="'+s+'" height="'+s+'" fill="var(--c2)" opacity=".75"/>';}
      else if(near<r-1e-9){edge++;o+='<rect x="'+X(i)+'" y="'+X(j)+'" width="'+s+'" height="'+s+'" fill="var(--c3)" opacity=".45"/>';}}}
    for(var g=0;g<=14;g++){o+='<line x1="'+X(g)+'" x2="'+X(g)+'" y1="'+X(0)+'" y2="'+X(14)+'" stroke="var(--line)" stroke-width="1"/><line y1="'+X(g)+'" y2="'+X(g)+'" x1="'+X(0)+'" x2="'+X(14)+'" stroke="var(--line)" stroke-width="1"/>';}
    if(E.sq){o+='<rect x="'+X(c-r)+'" y="'+X(c-r)+'" width="'+(2*r*s)+'" height="'+(2*r*s)+'" fill="none" stroke="var(--c4)" stroke-width="3.5"/>';
      o+='<polygon points="'+X(c)+','+X(c-r)+' '+X(c+r)+','+X(c)+' '+X(c)+','+X(c+r)+' '+X(c-r)+','+X(c)+'" fill="none" stroke="var(--c1)" stroke-width="3.5"/>';}
    o+='<circle cx="'+X(c)+'" cy="'+X(c)+'" r="'+(r*s)+'" fill="none" stroke="var(--ink)" stroke-width="3"/><line x1="'+X(c)+'" y1="'+X(c)+'" x2="'+X(c+r)+'" y2="'+X(c)+'" stroke="var(--ink)" stroke-width="2"/><circle cx="'+X(c)+'" cy="'+X(c)+'" r="4" fill="var(--ink)"/><text x="'+X(c+r/2)+'" y="'+(X(c)-7)+'" font-size="14" font-weight="700" text-anchor="middle">'+r+' cm</text>';
    $("estSvg").innerHTML=o;
    var d=2*r,st='';
    if(E.sq)st+='<div><span style="color:var(--c1)">원 안의 정사각형 (빨강)</span><b>'+d+'×'+d+'÷2 = '+(d*d/2)+' cm²</b></div><div><span style="color:var(--c4)">원 밖의 정사각형 (초록)</span><b>'+d+'×'+d+' = '+(d*d)+' cm²</b></div>';
    if(E.grid)st+='<div><span>원 안에 완전히 들어간 칸 (노랑)</span><b>'+inside+'칸</b></div><div><span>원에 걸친 칸까지 더하면</span><b>'+(inside+edge)+'칸</b></div>';
    st+='<div class="hot"><span>반지름×반지름×3.14</span><b>'+fmt(r*r*3.14)+' cm²</b></div>';
    $("estStats").innerHTML=st;
    var say=[];
    if(E.sq)say.push("원의 넓이는 <b>"+(d*d/2)+" cm²보다 크고 "+(d*d)+" cm²보다 작아요.</b> 반지름×반지름("+(r*r)+")의 2배와 4배 사이예요.");
    if(E.grid)say.push("모눈으로 세면 <b>"+inside+" cm²보다 크고 "+(inside+edge)+" cm²보다 작아요.</b>");
    if(!E.sq&&!E.grid)say.push("위의 단추를 눌러 어림하는 방법을 골라 보세요.");
    say.push("실제 넓이는 반지름×반지름의 약 3.14배예요.");
    $("estSay").innerHTML=say.join(" ");
  }
  $("rS").oninput=drawEst;
  $("showSq").onclick=function(){E.sq=!E.sq;this.setAttribute("aria-pressed",E.sq);drawEst();};
  $("showGrid").onclick=function(){E.grid=!E.grid;this.setAttribute("aria-pressed",E.grid);drawEst();};

  /* ---------- 4. 계산 연습 ---------- */
  var Q={r:3,giveD:false,pi:314};
  function ans(){return {c:2*Q.r*Q.pi/100,a:Q.r*Q.r*Q.pi/100};}
  function drawQuiz(){
    var R=40+Q.r*8,cx=210,cy=160,o='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="var(--surface2)" stroke="var(--ink)" stroke-width="3"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="var(--ink)"/>';
    if(Q.giveD)o+='<line x1="'+(cx-R)+'" x2="'+(cx+R)+'" y1="'+cy+'" y2="'+cy+'" stroke="var(--c3)" stroke-width="4"/><text x="'+cx+'" y="'+(cy-10)+'" font-size="18" font-weight="700" text-anchor="middle">지름 '+(2*Q.r)+' cm</text>';
    else o+='<line x1="'+cx+'" x2="'+(cx+R)+'" y1="'+cy+'" y2="'+cy+'" stroke="var(--c1)" stroke-width="4"/><text x="'+(cx+R/2)+'" y="'+(cy-10)+'" font-size="18" font-weight="700" text-anchor="middle">'+Q.r+' cm</text>';
    $("quizSvg").innerHTML=o;
    $("qTitle").textContent=(Q.giveD?"지름이 "+(2*Q.r):"반지름이 "+Q.r)+" cm인 원의 원주와 넓이를 구해 보세요";
    var A=ans(),pi=Q.pi/100;
    $("qSol").innerHTML=(Q.giveD?"반지름은 지름의 절반이니까 "+Q.r+" cm예요.<br>":"지름은 반지름의 2배니까 "+(2*Q.r)+" cm예요.<br>")+"원주 = 지름 × 원주율 = "+(2*Q.r)+" × "+pi+" = <b>"+fmt(A.c)+" cm</b><br>넓이 = 반지름 × 반지름 × 원주율 = "+Q.r+" × "+Q.r+" × "+pi+" = <b>"+fmt(A.a)+" cm²</b>";
  }
  function newQ(){Q.r=2+Math.floor(Math.random()*9);Q.giveD=Math.random()<0.5;$("aC").value="";$("aA").value="";$("qMsg").textContent="";$("qMsg").className="msg";$("qSol").classList.add("hidden");drawQuiz();}
  $("qNew").onclick=newQ;
  $("qShow").onclick=function(){$("qSol").classList.toggle("hidden");};
  $("qCheck").onclick=function(){var A=ans(),c=parseFloat($("aC").value),a=parseFloat($("aA").value),m=$("qMsg");
    if(isNaN(c)&&isNaN(a)){m.className="msg";m.textContent="답을 써 넣어 보세요.";return;}
    var okc=Math.abs(c-A.c)<0.005,oka=Math.abs(a-A.a)<0.005;
    if(okc&&oka){m.className="msg ok";m.textContent="둘 다 맞았어요!";}
    else{m.className="msg bad";var hint=!okc&&Math.abs(c-A.c/2)<0.005?" 원주는 반지름이 아니라 지름에 원주율을 곱해요.":(!oka&&Math.abs(a-4*A.a)<0.005?" 넓이는 지름이 아니라 반지름을 두 번 곱해요.":(!oka&&Math.abs(a-A.c)<0.005?" 넓이 칸에 원주를 썼어요.":""));
      m.textContent=(okc?"원주는 맞았어요. 넓이를 다시 구해 보세요.":oka?"넓이는 맞았어요. 원주를 다시 구해 보세요.":"다시 계산해 볼까요?")+hint;}};
  Array.prototype.forEach.call(document.querySelectorAll("[data-pi]"),function(b){b.onclick=function(){Q.pi=+b.dataset.pi;Array.prototype.forEach.call(document.querySelectorAll("[data-pi]"),function(o){o.setAttribute("aria-pressed",o===b);});$("qMsg").textContent="";drawQuiz();};});

  /* ---------- tabs ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"),function(b){b.onclick=function(){cancelAnimationFrame(raf);Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"),function(o){o.setAttribute("aria-selected",o===b);$("p-"+o.dataset.tab).classList.toggle("hidden",o!==b);});};});
  drawRoll();drawCut();drawEst();newQ();
})();
</script>
</body></html>
