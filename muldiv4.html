<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>

td.st{text-align:left;font-weight:700}
.ck{min-width:46px;min-height:36px;padding:4px 8px;font-size:19px;line-height:1}
td.res{width:44px;font-size:18px}

.dims .row label{min-width:40px;white-space:nowrap}
.say small .fr,.say .fr{font-size:.95em}
.dims .row{flex-wrap:nowrap}.dims .row input[type=range]{flex:1 1 0;min-width:0;width:auto}.dims .row output{min-width:30px;text-align:right}
canvas{cursor:default}
</style></head><body>
<div class="app">
  <header><h1>곱셈과 나눗셈</h1><p>(세 자리 수)×(두 자리 수), (세 자리 수)÷(두 자리 수)를 그림과 세로셈으로 알아봐요</p></header>

    <button data-t="nl" role="tab" aria-selected="false">③ 몇 번 덜어 낼까</button>

  </div></div>
  <section class="card"><div class="stage">
    <div id="top"></div>
    <canvas id="cv"></canvas>

</div>

function frVal(p){ var w=$(p+'w')?$(p+'w').value:'', n=$(p+'n').value, d=$(p+'d').value; if(n===''&&d===''&&w==='') return null; if(n===''&&d==='') return {n:+w,d:1}; if(d===''){ d='1'; } if(+d===0) return null; return {n:(+w||0)*(+d)+(+n||0),d:+d}; }

var PC=[BLUE,ORANGE,GREEN,PINK,YEL,GRAY,[170,150,235],[120,205,215]];

function chipsH(arr,cur,attr,st){ return '<div class="chips"'+(st?' style="'+st+'"':'')+'>'+arr.map(function(k){ return '<button class="chip" aria-pressed="'+(k[0]===cur)+'" data-'+attr+'="'+k[0]+'">'+k[1]+'</button>'; }).join('')+'</div>'; }
