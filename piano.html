<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>장조·단조 음계 건반</title>
<style>
:root{--bg:#f3f1ea;--surface:#fff;--surface2:#f8f6f0;--ink:#1f2430;--muted:#687083;--line:#d9d5c8;--accent:#3d5a98;--accent-ink:#fff;--half:#d2452f;--tonic:#f2b84b;--in:#bfe0c8;--inb:#3f8f5d;--ok:#2e7d4f;--bad:#c2372d;--shadow:0 1px 2px rgba(30,30,40,.07),0 8px 22px -12px rgba(30,30,40,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--surface:#1d2027;--surface2:#242832;--ink:#e9ebf1;--muted:#9aa2b4;--line:#333846;--accent:#8fb0ee;--accent-ink:#10182a;--half:#ff8a73;--tonic:#f2b84b;--in:#3c7a55;--inb:#7fd0a0;--ok:#6fcf97;--bad:#ff8a7a;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#14161b;--surface:#1d2027;--surface2:#242832;--ink:#e9ebf1;--muted:#9aa2b4;--line:#333846;--accent:#8fb0ee;--accent-ink:#10182a;--half:#ff8a73;--tonic:#f2b84b;--in:#3c7a55;--inb:#7fd0a0;--ok:#6fcf97;--bad:#ff8a7a;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.app{max-width:1180px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{margin:0;font-size:clamp(20px,3vw,26px)}
header p{margin:0;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-right:2px}
button{font:inherit;cursor:pointer}
.chip,.btn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.btn{border-radius:10px;background:var(--surface)}
.chip small{font-weight:500;color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"],.btn[aria-pressed="true"],.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:700;font-size:14.5px;padding:8px 14px;border-radius:9px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.info div{background:var(--surface2);border-radius:10px;padding:8px 11px}
.info b{display:block;font-size:17px}
.info span{font-size:12px;color:var(--muted)}
.kbwrap{padding:12px 12px 6px}
.kb{position:relative;display:flex;height:clamp(150px,24vw,250px);touch-action:none;user-select:none;-webkit-user-select:none}
.w{flex:1;border:1px solid #8a8f9c;border-radius:0 0 7px 7px;background:#fdfdfb;color:#1f2430;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 7px;font-size:clamp(10px,1.5vw,15px);font-weight:700;line-height:1.15;position:relative;margin-right:-1px}
.b{position:absolute;top:0;height:61%;width:4.3%;background:#22252d;color:#fff;border:1px solid #000;border-radius:0 0 5px 5px;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 5px;font-size:clamp(8px,1.05vw,12px);font-weight:700;line-height:1.1;white-space:pre-line;text-align:center}
.w em,.b em{font-style:normal;font-weight:500;font-size:.8em;opacity:.6}
.w.dim{color:#a4a8b3}
.w.in{background:var(--in)}
.b.in{background:var(--inb);border-color:var(--inb);color:#fff}
.w.tonic,.b.tonic{background:var(--tonic);color:#2a2000;border-color:#b98312}
.w.on,.b.on{filter:brightness(.82);transform:translateY(2px)}
.w.ok,.b.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.w.bad,.b.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
svg{display:block;width:100%;height:auto}
.arc text{font-size:30px;font-weight:700;text-anchor:middle;fill:var(--muted)}
.arc path{fill:none;stroke:var(--muted);stroke-width:3}
.arc .h text{fill:var(--half)} .arc .h path{stroke:var(--half);stroke-width:4}
.msg{min-height:26px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.note{color:var(--muted);font-size:13.5px;margin:0}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps span{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface2)}
.steps span.h{color:var(--half);border-color:var(--half)}
.steps span.done{background:var(--ok);border-color:var(--ok);color:#fff}
.steps span.now{outline:2.5px solid var(--accent)}
.staff line{stroke:var(--ink);stroke-width:1.2}
.staff ellipse{fill:var(--surface);stroke:var(--ink);stroke-width:2.2}
.staff ellipse.t{fill:var(--tonic)}
.staff text{fill:var(--ink)}
.staff text.s{font-size:13px;fill:var(--muted);text-anchor:middle;font-weight:600}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.hidden{display:none!important}
.chordbtn{font-size:20px;min-width:64px;padding:10px 14px}
h2{font-size:15px;margin:0 0 8px}
</style>
</head><body>
<div class="app">
  <header>
    <h1>장조·단조 음계 건반</h1>
    <p id="sub"></p>
  </header>

  <div class="card">
    <div class="row" style="margin-bottom:8px"><div class="tabs" role="group" aria-label="장조 단조"><button id="mMaj" aria-selected="true">장조</button><button id="mMin" aria-selected="false">단조</button></div><span class="lab" style="margin-left:6px">조 고르기</span><div class="row" id="keys"></div></div>
    <div class="row">
      <div class="tabs" role="tablist">
        <button id="tScale" role="tab" aria-selected="true">① 음계 살펴보기</button>
        <button id="tFind" role="tab" aria-selected="false">② 직접 찾기</button>
        <button id="tChord" role="tab" aria-selected="false">③ 주요 3화음</button>
      </div>
      <span class="lab" style="margin-left:8px">건반 글자</span>
      <button class="chip" data-lbl="name" aria-pressed="true">음이름</button>
      <button class="chip" data-lbl="sol" aria-pressed="false">계이름</button>
      <button class="chip" data-lbl="none" aria-pressed="false">숨기기</button>
    </div>
  </div>

  <div class="card kbwrap">
    <div class="kb" id="kb"></div>
    <svg id="arcs" class="arc" viewBox="0 0 1500 78" aria-hidden="true"></svg>
  </div>

  <!-- 1 -->
  <div id="pScale" class="grid2">
    <div class="card">
      <div class="info" id="info"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="playScale">음계 듣기</button>
        <button class="btn" id="playNaive">고치기 전 소리 듣기</button>
      </div>
      <p class="note" id="naiveNote" style="margin-top:8px"></p>
    </div>
    <div class="card">
      <h2>오선보에서 보기</h2>
      <svg id="staff" class="staff" viewBox="0 0 720 150" role="img" aria-label="음계 악보"></svg>
    </div>
  </div>

  <!-- 2 -->
  <div id="pFind" class="card hidden">
    <h2 id="findTitle"></h2>
    <div class="steps" id="steps"></div>
    <p class="msg" id="findMsg" style="margin:10px 0 6px"></p>
    <div class="row">
      <button class="btn" id="findReset">처음부터 다시</button>
      <button class="btn" id="findHint"></button>
      <button class="btn" id="findShow">정답 보기</button>
    </div>
    <p class="note" style="margin-top:8px">온음은 건반 <b>두 칸</b>(사이에 건반이 하나 있음), 반음은 <b>바로 옆</b> 건반이에요. 검은건반도 한 칸으로 세요.</p>
  </div>

  <!-- 3 -->
  <div id="pChord" class="grid2 hidden">
    <div class="card">
      <h2>화음 눌러 듣기</h2>
      <div class="row">
        <button class="btn chordbtn" data-ch="0">Ⅰ</button>
        <button class="btn chordbtn" data-ch="1">Ⅳ</button>
        <button class="btn chordbtn" data-ch="2">Ⅴ</button>
        <button class="btn" id="arp" aria-pressed="false">펼쳐서 듣기</button>
      </div>
      <p class="msg" id="chordMsg" style="margin:10px 0 0"></p>
      <p class="note" id="chordNote"></p>
    </div>
    <div class="card">
      <h2>화음 듣고 맞히기</h2>
      <div class="row">
        <button class="btn primary" id="quizPlay">문제 듣기</button>
        <button class="btn chordbtn" data-ans="0">Ⅰ</button>
        <button class="btn chordbtn" data-ans="1">Ⅳ</button>
        <button class="btn chordbtn" data-ans="2">Ⅴ</button>
      </div>
      <p class="msg" id="quizMsg" style="margin:10px 0 0"></p>
      <p class="note">먼저 Ⅰ 화음을 들려준 뒤 문제 화음이 나와요.</p>
    </div>
  </div>
</div>
<script>
(function(){
  var NAT=[0,2,4,5,7,9,11], KO=["다","라","마","바","사","가","나"], EN="CDEFGAB", MAJ, SOL, KEYS;
  var MODE={maj:{steps:[0,2,4,5,7,9,11,12],sol:["도","레","미","파","솔","라","시","도"],suffix:"장조",pat:"온-온-반-온-온-온-반",
      keys:[{li:0,pc:0},{li:4,pc:7},{li:1,pc:2},{li:5,pc:9},{li:2,pc:4},{li:3,pc:5},{li:6,pc:10},{li:2,pc:3},{li:5,pc:8}],
      third:[4,4,4],csol:[["도","미","솔"],["파","라","도"],["솔","시","레"]]},
    min:{steps:[0,2,3,5,7,8,10,12],sol:["라","시","도","레","미","파","솔","라"],suffix:"단조",pat:"온-반-온-온-반-온-온",
      keys:[{li:5,pc:9},{li:2,pc:4},{li:6,pc:11},{li:3,pc:6},{li:0,pc:1},{li:1,pc:2},{li:4,pc:7},{li:0,pc:0},{li:3,pc:5}],
      third:[3,3,4],csol:[["라","도","미"],["레","파","라"],["미","솔♯","시"]]}};
  function applyMode(m){MAJ=MODE[m].steps;SOL=MODE[m].sol;KEYS=MODE[m].keys;}
  applyMode("maj");
  var S={mode:"maj",key:1,tab:"scale",lbl:"name",found:0,reveal:false,arp:false,quiz:null};
  function $(id){return document.getElementById(id);}
  function acc(pc,li){return ((pc-NAT[li])%12+18)%12-6;}
  function nm(li,a){return (a>0?"올림":a<0?"내림":"")+KO[li];}
  function en(li,a){return EN[li]+(a>0?"♯":a<0?"♭":"");}
  function scale(k){var K=KEYS[k],t=60+K.pc,out=[];for(var d=0;d<8;d++){var li=(K.li+d)%7,m=t+MAJ[d];out.push({midi:m,li:li,acc:acc(m%12,li),deg:d});}return out;}
  function naive(k){var K=KEYS[k],t=60+K.pc,out=[t];for(var d=1;d<7;d++){out.push(t+((NAT[(K.li+d)%7]-K.pc)%12+12)%12);}out.push(t+12);return out;}
  function keyName(k){var K=KEYS[k];return nm(K.li,acc(K.pc,K.li))+MODE[S.mode].suffix;}
  function sig(k){var sc=scale(k).slice(0,7),sh=sc.filter(function(n){return n.acc>0;}),fl=sc.filter(function(n){return n.acc<0;});
    var so=[3,0,4,1,5,2,6],fo=[6,2,5,1,4,0,3],list=[],type=sh.length?"♯":fl.length?"♭":"";
    (sh.length?so:fo).forEach(function(li){(sh.length?sh:fl).forEach(function(n){if(n.li===li)list.push(n);});});
    return {type:type,list:list};}

  /* ---------- audio ---------- */
  var AC=null,master=null;
  function audio(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();var comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.55;master.connect(comp);comp.connect(AC.destination);}
    if(AC.state==="suspended")AC.resume();return AC;}
  function tone(m,when,dur){var a=audio();if(!a)return;var t=a.currentTime+(when||0),f=440*Math.pow(2,(m-69)/12),g=a.createGain();dur=dur||1.5;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.42,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);g.connect(master);
    [["triangle",1,1],["sine",2,.28],["sine",3,.1]].forEach(function(p){var o=a.createOscillator(),og=a.createGain();o.type=p[0];o.frequency.value=f*p[1];og.gain.value=p[2];o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.05);});}
  var seqId=0;
  function flash(m,ms,cls){var e=keyEl[m];if(!e)return;e.classList.add(cls||"on");setTimeout(function(){e.classList.remove(cls||"on");},ms);}
  function playSeq(notes,gap,done){var id=++seqId;gap=gap||420;notes.forEach(function(n,i){setTimeout(function(){if(id!==seqId)return;var arr=Array.isArray(n)?n:[n];arr.forEach(function(m){tone(m,0,Array.isArray(n)?2:1.1);flash(m,gap*.85);});if(i===notes.length-1&&done)setTimeout(done,gap);},i*gap);});}

  /* ---------- keyboard ---------- */
  var kb=$("kb"),keyEl={},WI={0:0,2:1,4:2,5:3,7:4,9:5,11:6},BI={1:0,3:1,6:3,8:4,10:5};
  function cx(m){var o=Math.floor((m-60)/12),pc=(m-60)%12;return pc in WI?(o*7+WI[pc]+.5)*100:(o*7+BI[pc]+1)*100;}
  for(var m=60;m<=84;m++){var pc=m%12,b=document.createElement("button");b.dataset.midi=m;b.setAttribute("aria-label",(pc in WI?KO[WI[pc]]:"검은건반"));
    if(pc in WI){b.className="w";}else{b.className="b";b.style.left="calc("+(cx(m)/15)+"% - 2.15%)";}
    kb.appendChild(b);keyEl[m]=b;}
  kb.addEventListener("pointerdown",function(e){var t=e.target.closest("[data-midi]");if(!t)return;e.preventDefault();press(+t.dataset.midi);});
  kb.addEventListener("contextmenu",function(e){e.preventDefault();});

  function press(m){seqId++;tone(m);flash(m,180);if(S.tab==="find"&&!S.reveal)check(m);}

  /* ---------- find ---------- */
  function check(m){var sc=scale(S.key),exp=sc[S.found].midi,msg=$("findMsg");
    if(m===exp){S.found++;
      if(S.found===8){S.reveal=true;msg.className="msg ok";msg.textContent="완성! "+keyName(S.key)+" 음계를 찾았어요. "+(S.key?refName()+"와 똑같이 ":"")+"'"+SOL.join("")+"'로 들리나요?";render();setTimeout(function(){playSeq(sc.map(function(n){return n.midi;}));},500);return;}
      msg.className="msg ok";msg.textContent="맞아요! 다음은 '"+SOL[S.found]+"' 자리예요.";render();
    }else{flash(m,450,"bad");msg.className="msg bad";
      if(S.found===0){msg.textContent="으뜸음 '"+nm(sc[0].li,sc[0].acc)+"'부터 시작해요. 노란 건반을 눌러 보세요.";}
      else{var st=MAJ[S.found]-MAJ[S.found-1];msg.textContent=(m<exp?"조금 더 높은":"조금 더 낮은")+" 음이에요. 앞 음에서 "+(st===2?"온음(건반 두 칸)":"반음(바로 옆 건반)")+" 올라가요.";}
    }}
  function resetFind(){S.found=0;S.reveal=false;$("findMsg").className="msg";$("findMsg").textContent="노란 건반(으뜸음)부터 차례로 눌러 보세요.";}

  /* ---------- render ---------- */
  function render(){
    var sc=scale(S.key),by={};sc.forEach(function(n){by[n.midi]=n;});
    var hide=(S.tab==="find"&&!S.reveal);
    for(var m=60;m<=84;m++){var e=keyEl[m],n=by[m],pc=m%12,white=pc in WI,shown=n&&(!hide||n.deg<S.found);
      e.classList.toggle("in",!!shown&&!(hide));e.classList.toggle("ok",!!(hide&&shown));
      e.classList.toggle("tonic",!!n&&(n.deg===0||n.deg===7)&&(!hide||n.deg===0||shown)&&!(hide&&shown));
      e.classList.toggle("dim",white&&!n&&!hide);
      var txt="";
      if(S.lbl==="name"){ if(shown||(n&&!hide)) txt=(white?nm(n.li,n.acc):(n.acc>0?"올림\n":"내림\n")+KO[n.li])+"<em>"+(white?"<br>":"\n")+en(n.li,n.acc)+"</em>"; else if(white) txt=KO[WI[pc]]+"<em><br>"+EN[WI[pc]]+"</em>"; }
      else if(S.lbl==="sol"){ if(shown||(n&&!hide)) txt=SOL[n.deg]; }
      e.innerHTML=txt;}
    // arcs
    var a="",upto=hide?S.found:8;
    for(var i=1;i<upto;i++){var x1=cx(sc[i-1].midi),x2=cx(sc[i].midi),h=(MAJ[i]-MAJ[i-1]===1),mx=(x1+x2)/2;
      a+='<g class="'+(h?"h":"")+'"><path d="M'+x1+' 6 Q'+mx+' 46 '+x2+' 6"/><text x="'+mx+'" y="66">'+(h?"반":"온")+'</text></g>';}
    $("arcs").innerHTML=a;
    // key chips
    Array.prototype.forEach.call($("keys").children,function(c,i){c.setAttribute("aria-pressed",i===S.key?"true":"false");});
    // info
    var sg=sig(S.key);
    $("info").innerHTML='<div><span>조 이름</span><b>'+keyName(S.key)+'</b></div><div><span>으뜸음 (계이름 '+SOL[0]+')</span><b>'+nm(sc[0].li,sc[0].acc)+' ('+en(sc[0].li,sc[0].acc)+')</b></div><div><span>조표</span><b>'+(sg.type?sg.type+" "+sg.list.length+"개":"없음")+'</b></div><div><span>'+(sg.type==="♭"?"내리는 음":"올리는 음")+'</span><b style="font-size:14.5px">'+(sg.list.length?sg.list.map(function(n){return nm(n.li,n.acc);}).join(", "):"없음 (흰건반만)")+'</b></div><div style="grid-column:1/-1"><span>나란한조 (같은 건반, 으뜸음만 달라요)</span><b style="font-size:15px">'+relName()+' <button class="btn" id="goRel" style="padding:3px 10px;font-size:13px;margin-left:6px">바꿔 보기</button></b></div>';
    $("goRel").onclick=function(){setMode(S.mode==="maj"?"min":"maj");};
    var nv=naive(S.key),diff=[];for(var d=0;d<8;d++)if(nv[d]!==sc[d].midi)diff.push(SOL[d]);
    $("playNaive").disabled=!diff.length;
    $("naiveNote").innerHTML=diff.length?"조표 없이 치면 <b>'"+diff.join("', '")+"'</b> 자리가 어색하게 들려요. 그래서 조표("+sg.list.map(function(n){return nm(n.li,n.acc);}).join(", ")+")를 붙여요.":keyName(S.key)+"는 흰건반만으로 "+MODE[S.mode].pat+"이 돼요. 그래서 조표가 없어요.";
    // staff
    var st='',y=function(s){return 105-s*5;};
    for(var l=0;l<5;l++)st+='<line x1="10" x2="710" y1="'+(55+l*10)+'" y2="'+(55+l*10)+'"/>';
    st+='<text x="12" y="98" font-size="62" font-family="serif">𝄞</text>';
    var so=[10,7,11,8,5,9,6],fo=[6,9,5,8,4,7,3];
    sg.list.forEach(function(n,i){var s=(sg.type==="♯"?so:fo)[i];st+='<text x="'+(62+i*14)+'" y="'+(y(s)+(sg.type==="♯"?7:5))+'" font-size="23" font-family="serif">'+sg.type+'</text>';});
    sc.forEach(function(n,i){var s=KEYS[S.key].li+i,x=160+i*70,yy=y(s);
      if(s===0)st+='<line x1="'+(x-14)+'" x2="'+(x+14)+'" y1="105" y2="105"/>';
      if(s>=12)st+='<line x1="'+(x-14)+'" x2="'+(x+14)+'" y1="45" y2="45"/>';
      st+='<ellipse class="'+(i%7===0?"t":"")+'" cx="'+x+'" cy="'+yy+'" rx="8.5" ry="5.8"/><text class="s" x="'+x+'" y="132">'+SOL[i]+'</text><text class="s" x="'+x+'" y="147">'+nm(n.li,n.acc)+'</text>';});
    $("staff").innerHTML=st;
    // find
    $("findTitle").textContent="'"+nm(sc[0].li,sc[0].acc)+"'에서 시작해 '"+SOL.join("")+"'로 들리는 건반 8개를 찾아보세요";
    $("findHint").textContent=refName()+" 소리 다시 듣기";
    $("sub").innerHTML="어느 음에서 시작해도 <b>"+MODE[S.mode].pat+"</b>이면 "+MODE[S.mode].suffix+"예요";
    $("chordNote").textContent=S.mode==="maj"?"Ⅰ 으뜸화음(도·미·솔) · Ⅳ 버금딸림화음(파·라·도) · Ⅴ 딸림화음(솔·시·레)":"Ⅰ 으뜸화음(라·도·미) · Ⅳ 버금딸림화음(레·파·라) · Ⅴ 딸림화음(미·솔♯·시) — 단조의 Ⅴ에서는 '솔'을 반음 올려요.";
    var sp='';for(var k=0;k<8;k++){sp+='<span class="'+(k<S.found?"done":"")+(k===S.found&&!S.reveal?" now":"")+'">'+SOL[k]+'</span>';if(k<7){var hh=MAJ[k+1]-MAJ[k]===1;sp+='<span class="'+(hh?"h":"")+'" style="border-style:dashed">'+(hh?"반":"온")+'</span>';}}
    $("steps").innerHTML=sp;
  }

  /* ---------- controls ---------- */
  function refName(){var k=S.key;S.key=0;var n=keyName(0);S.key=k;return n;}
  function relName(){var o=S.mode==="maj"?"min":"maj",K=MODE[o].keys[S.key];return nm(K.li,acc(K.pc,K.li))+MODE[o].suffix;}
  function buildKeys(){$("keys").innerHTML="";KEYS.forEach(function(K,i){var b=document.createElement("button");b.className="chip";var s=sig(i);b.innerHTML=keyName(i)+"<small>"+(s.type?s.type+s.list.length:"조표 없음")+"</small>";
    b.addEventListener("click",function(){S.key=i;seqId++;resetFind();S.quiz=null;$("quizMsg").textContent="";$("chordMsg").textContent="";render();});$("keys").appendChild(b);});}
  function setMode(m){S.mode=m;applyMode(m);seqId++;$("mMaj").setAttribute("aria-selected",m==="maj");$("mMin").setAttribute("aria-selected",m==="min");buildKeys();resetFind();S.quiz=null;$("quizMsg").textContent="";$("chordMsg").textContent="";render();}
  $("mMaj").onclick=function(){setMode("maj");};$("mMin").onclick=function(){setMode("min");};
  buildKeys();
  function setTab(t){S.tab=t;seqId++;$("tScale").setAttribute("aria-selected",t==="scale");$("tFind").setAttribute("aria-selected",t==="find");$("tChord").setAttribute("aria-selected",t==="chord");
    $("pScale").classList.toggle("hidden",t!=="scale");$("pFind").classList.toggle("hidden",t!=="find");$("pChord").classList.toggle("hidden",t!=="chord");
    if(t==="find")resetFind();render();}
  $("tScale").onclick=function(){setTab("scale");};$("tFind").onclick=function(){setTab("find");};$("tChord").onclick=function(){setTab("chord");};
  Array.prototype.forEach.call(document.querySelectorAll("[data-lbl]"),function(b){b.onclick=function(){S.lbl=b.dataset.lbl;Array.prototype.forEach.call(document.querySelectorAll("[data-lbl]"),function(o){o.setAttribute("aria-pressed",o===b);});render();};});
  $("playScale").onclick=function(){playSeq(scale(S.key).map(function(n){return n.midi;}));};
  $("playNaive").onclick=function(){playSeq(naive(S.key));};
  $("findReset").onclick=function(){resetFind();render();};
  $("findHint").onclick=function(){playSeq(scale(0).map(function(n){return n.midi;}),380);};
  $("findShow").onclick=function(){S.reveal=true;S.found=8;$("findMsg").className="msg";$("findMsg").textContent="초록 건반이 "+keyName(S.key)+" 음계예요. 간격(온·반)을 확인해 보세요.";render();playSeq(scale(S.key).map(function(n){return n.midi;}));};
  function chordNotes(i){var sc=scale(S.key),t=sc[0].midi,r=[0,5,7][i],d=[0,3,4][i],th=MODE[S.mode].third[i],ms=[t+r,t+r+th,t+r+7];
    if(ms[2]>84)ms=ms.map(function(m){return m-12;});
    return ms.map(function(m,j){var n=sc[(d+j*2)%7],a=acc(m%12,n.li);return {midi:m,name:nm(n.li,a)};});}
  function chord(i){return chordNotes(i).map(function(n){return n.midi;});}
  function chordText(i){return chordNotes(i).map(function(n){return n.name;}).join(" · ");}
  function playChord(i){var c=chord(i);if(S.arp)playSeq([c[0],c[1],c[2],c[1],c[2],[c[0],c[1],c[2]]],300);else playSeq([c],1100);}
  Array.prototype.forEach.call(document.querySelectorAll("[data-ch]"),function(b){b.onclick=function(){var i=+b.dataset.ch;playChord(i);$("chordMsg").className="msg";$("chordMsg").textContent=["Ⅰ","Ⅳ","Ⅴ"][i]+" 화음: "+chordText(i)+"  ("+MODE[S.mode].csol[i].join("·")+")";};});
  $("arp").onclick=function(){S.arp=!S.arp;this.setAttribute("aria-pressed",S.arp);};
  $("quizPlay").onclick=function(){if(S.quiz===null)S.quiz=Math.floor(Math.random()*3);$("quizMsg").className="msg";$("quizMsg").textContent="어떤 화음일까요? Ⅰ, Ⅳ, Ⅴ 중에서 골라 보세요.";var id=++seqId;[chord(0),chord(S.quiz)].forEach(function(c,i){setTimeout(function(){if(id!==seqId)return;c.forEach(function(m){tone(m,0,2);});},i*1300);});};
  Array.prototype.forEach.call(document.querySelectorAll("[data-ans]"),function(b){b.onclick=function(){var q=$("quizMsg");if(S.quiz===null){q.className="msg";q.textContent="먼저 '문제 듣기'를 눌러 주세요.";return;}
    var i=+b.dataset.ans;if(i===S.quiz){q.className="msg ok";q.textContent="정답! "+["Ⅰ","Ⅳ","Ⅴ"][i]+" 화음("+chordText(i)+")이에요. '문제 듣기'를 누르면 새 문제가 나와요.";playSeq([chord(i)],1100);S.quiz=null;}
    else{q.className="msg bad";q.textContent="다시 들어 볼까요? '문제 듣기'를 한 번 더 눌러 보세요.";}};});
  resetFind();render();
})();
</script>
</body></html>
